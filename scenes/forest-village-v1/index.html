<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMiniHome · 숲 마을 기본 장면 v1</title>
<style>
:root{color-scheme:dark;--cream:#fff4d7;--brown:#765233;--leaf:#294837}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#1c2e30;color:#f9f8dc;font-family:system-ui,"Malgun Gothic",sans-serif}
.shell{width:min(100%,1530px);margin:auto;padding:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.toolbar strong{font-size:16px}.toolbar small{color:#bdd5d0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,input{font:inherit}
button{cursor:pointer}
.tools button,.panel button{background:var(--cream);color:#293c2e;border:2px solid var(--brown);border-radius:8px;padding:8px 11px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid #ffb41e;outline-offset:3px}
.scene-area{position:relative}
.viewport{width:100%;overflow:auto;overscroll-behavior:contain;scrollbar-color:#779c7c #274a42;border:4px solid #53774b;border-radius:10px;background:#88d6b1;box-shadow:0 10px 26px #071b185c}
.frame-sizer{position:relative}
.stage{position:absolute;left:0;top:0;width:1774px;height:887px;transform-origin:top left}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.hotspot{position:absolute;z-index:2;border:2px dashed transparent;background:transparent;border-radius:24px;padding:0;color:transparent}
.hotspot:hover,.hotspot:focus-visible,.hotspot.is-active,.debug .hotspot{border-color:#f9e790;background:#ffe78a2b;color:#fff}
.hotspot::after{content:attr(data-label);position:absolute;bottom:-21px;left:10%;font-weight:800;font-size:18px;white-space:nowrap;text-shadow:1px 2px 2px #153b2d,0 0 3px #153b2d;opacity:0}
.hotspot:hover::after,.hotspot:focus-visible::after,.debug .hotspot::after{opacity:1}
.actor{position:absolute;z-index:4;width:var(--hit-width);height:var(--size);transform:translate(-50%,var(--foot-neg));border:0;background:none;padding:0}
.actor::before{content:"";position:absolute;width:46%;height:8%;left:27%;top:calc(var(--foot) - 5%);background:#1b38194d;filter:blur(5px);border-radius:50%;transform:translateX(var(--sprite-dx,0px))}
.actor img{position:absolute;display:block;left:calc((100% - var(--size))/2);top:0;width:var(--size);height:var(--size);object-fit:contain;pointer-events:none}
.actor.is-selected{filter:drop-shadow(0 0 6px #fff8a5)}
.debug .actor{outline:2px dashed #fddc77}
.debug .actor::after{content:"";position:absolute;width:8px;height:8px;background:#ff3b64;border:2px solid #fff;border-radius:50%;left:calc(50% - 4px);top:calc(var(--foot) - 4px);pointer-events:none}
.stage-overlay{position:absolute;inset:0;z-index:3;pointer-events:none}
.bridge-guide{fill:none;stroke:#fef4a0;stroke-width:8;stroke-linecap:round;stroke-dasharray:16 12;filter:drop-shadow(0 2px 1px #493d23)}
.pond-ripple{position:absolute;left:1380px;top:755px;width:135px;height:50px;border:8px solid #fff4ba;border-radius:50%;opacity:.85;box-shadow:0 0 10px #fff9d0}
.pond-ripple.play{animation:pond 1.6s ease-out infinite}
@keyframes pond{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.3);opacity:0}}
.guide-line{position:absolute;left:0;top:70%;height:1px;border-top:2px dashed #ffea9f;width:100%;pointer-events:none;display:none}
.debug .guide-line{display:block}
.panel{position:absolute;z-index:20;bottom:16px;left:16px;width:min(370px,calc(100% - 32px));padding:17px;background:#fff8defa;border:4px solid #79573a;border-radius:12px;color:#263f29;box-shadow:5px 6px 0 #17392e91}
.panel h2{margin:0 35px 8px 0;font-size:19px}.panel p{margin:0 0 10px;font-size:14px;line-height:1.55}.panel a{color:#174e7a}
.panel .close{position:absolute;right:10px;top:9px;padding:4px 8px}
.panel form{display:flex;gap:6px;margin:10px 0;align-items:stretch}
.panel input{flex:1;min-width:0;padding:9px;border:2px solid #79573a;background:white;color:#253e2b;border-radius:7px;font-size:15px}
.panel form button{white-space:nowrap}
.panel .notice{font-size:12px;color:#6d5945}
.legend{color:#c7ded8;font-size:12px;line-height:1.6;margin:10px 3px 0}
@media(max-width:740px){.toolbar strong{font-size:14px}.toolbar small{font-size:12px}.panel{position:relative;left:auto;bottom:auto;width:100%;margin-top:10px;box-shadow:none}.shell{padding:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
 <div class="toolbar"><div><strong>MyMiniHome · 기본 숲 마을 템플릿 1종</strong> <small>v1 · 움직임/반응 검토용</small></div>
  <div class="tools"><button id="toggleFit" type="button" aria-pressed="false">전체 보기</button><button id="toggleMotion" type="button" aria-pressed="false">움직임 정지</button><button id="toggleGuides" type="button" aria-pressed="false">앵커 표시</button><button id="reset" type="button">팝업 닫기</button></div>
 </div>
 <div class="scene-area">

   <div class="frame-sizer" id="frameSizer"><div class="stage" id="stage">
    <img class="base" id="background" alt="오두막, 연못, 폭포, 다리, 독서 공간이 있는 픽셀 숲 마을"/>
    <div id="hotspots"></div>
    <svg class="stage-overlay" viewBox="0 0 1774 887" aria-hidden="true"><path id="bridgeGuide" class="bridge-guide" d="M1058 611 Q1165 545 1285 585" hidden/></svg>
    <div id="pondRipple" class="pond-ripple" hidden aria-hidden="true"></div>
    <div id="actors"></div><div class="guide-line"></div>
   </div></div>
  </div>
  <section class="panel" id="panel" hidden aria-label="마을 상호작용 패널" aria-live="polite">
   <button class="close" id="close" type="button" aria-label="정보창 닫기">×</button>
   <h2 id="panelTitle"></h2><p id="panelBody"></p><p id="panelLink"></p>
   <form id="noteForm" hidden><input id="noteInput" maxlength="80" placeholder="한 줄 메시지 (80자)" aria-label="한 줄 메시지"/><button type="submit">미리보기</button></form>
   <p class="notice" id="noteNotice" hidden>입력은 화면 안에서만 표시됩니다. ChatGPT로 전송하거나 저장하지 않습니다.</p>
   <p id="previewMessage" hidden></p>
  </section>
 </div>
 <p class="legend" id="statusNote">캐릭터가 각자 정해진 잔디 구간 안에서만 움직이는 시제품이야. 사물은 클릭 반응을 제공하고, 연결하지 않은 프로젝트·GPT 링크는 열리지 않아.</p>
 <p class="legend" id="responsiveNote">장면은 원본 1774×887 비율로 관리돼. 좁은 화면에서는 최소 확대율을 유지하므로 마을을 좌우로 스크롤해 탐색할 수 있어.</p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),scene=JSON.parse($('scene').textContent),stage=$('stage'),viewport=$('viewport'),panel=$('panel');
const spriteBase='../../assets/review/v0.2/frames/';
const frameSrc=(id,n)=>spriteBase+id+'/'+id+'_'+String(n).padStart(2,'0')+'.png';
const walkRoot='../../assets/review/walk-v0.1/';
const walkFrameSrc=(id,direction,n)=>walkRoot+'frames/'+id+'/'+id+'_walk_'+direction+'_'+String(n).padStart(2,'0')+'.png';
const objectButtons=new Map(),characterNodes=new Map();
const motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
let paused=false,selected=null,clock=0,lastTime=0,lastScale=0,fitAll=false;
$('background').src=scene.background;
for(const obj of scene.hotspots){
 const btn=document.createElement('button');btn.type='button';btn.className='hotspot';btn.dataset.label=obj.label;
 btn.setAttribute('aria-label',obj.label+' 상호작용');btn.style.left=obj.x+'px';btn.style.top=obj.y+'px';btn.style.width=obj.w+'px';btn.style.height=obj.h+'px';
 btn.addEventListener('click',()=>openInfo(obj));objectButtons.set(obj.id,btn);$('hotspots').append(btn);
}
for(const actor of scene.characters){
 const btn=document.createElement('button');btn.type='button';btn.className='actor';btn.title=actor.label+' 프로필';
 btn.setAttribute('aria-label',actor.label+' 프로필 열기');btn.style.setProperty('--size',actor.size+'px');btn.style.setProperty('--hit-width',(actor.patrol.endX-actor.patrol.startX+actor.size*0.68)+'px');btn.style.left=((actor.patrol.startX+actor.patrol.endX)/2)+'px';btn.style.top=actor.patrol.y+'px';
 btn.style.setProperty('--foot',(actor.footFraction*100)+'%');btn.style.setProperty('--foot-neg',(-actor.footFraction*100)+'%');
 const img=document.createElement('img');img.src=frameSrc(actor.id,1);img.alt='';img.decoding='async';img.draggable=false;
 btn.append(img);btn.addEventListener('click',()=>openInfo(actor));$('actors').append(btn);
 characterNodes.set(actor.id,{btn,img,actor,frame:1,direction:'',walkReady:false,x:actor.x,y:actor.y});btn.dataset.animation='legacy-gestures';
 for(let n=2;n<=6;n++){const pre=new Image();pre.src=frameSrc(actor.id,n)}
}
// Activate a candidate walk cycle only when its complete published pack is available.
function preloadWalkPack(){
 if(typeof fetch!=='function')return;
 fetch(walkRoot+'MANIFEST.json',{cache:'no-store'}).then(r=>r.ok?r.json():null)
  .then(m=>{
   if(!m||!m.count||m.count.totalPngs!==48||m.status!=='REVIEW_CANDIDATE_NOT_APPROVED')return;
   for(const info of characterNodes.values()){
    const a=info.actor,pending=[];
    for(const dir of ['right','left'])for(let n=1;n<=6;n++){
     pending.push(new Promise((resolve,reject)=>{
      const candidate=new Image();candidate.onload=resolve;candidate.onerror=reject;
      candidate.src=walkFrameSrc(a.id,dir,n);
     }));
    }
    Promise.all(pending).then(()=>{
     info.walkReady=true;info.frame=0;info.direction='';
     info.btn.dataset.animation='walk-v0.1-candidate';
     info.btn.style.setProperty('--foot','89.84375%');
     info.btn.style.setProperty('--foot-neg','-89.84375%');
    }).catch(()=>{info.walkReady=false;info.btn.dataset.animation='legacy-gestures'});
   }
  }).catch(()=>{}); // File missing or denied: keep previous working visuals.
}
preloadWalkPack();
const clearEffects=()=>{
 for(const btn of objectButtons.values())btn.classList.remove('is-active');
 for(const info of characterNodes.values())info.btn.classList.remove('is-selected');
 $('bridgeGuide').setAttribute('hidden','');$('pondRipple').hidden=true;$('pondRipple').classList.remove('play');
};
function closeInfo(){
 panel.hidden=true;$('noteForm').hidden=true;$('noteNotice').hidden=true;$('previewMessage').hidden=true;
 $('noteInput').value='';selected=null;clearEffects();
}
function openInfo(obj){
 clearEffects();selected=obj.id;panel.hidden=false;
 $('panelTitle').textContent=obj.label;
 $('panelBody').textContent=obj.note||((obj.kind==='gpt'?'GPT':'프로젝트')+' 프로필 시안 — 실제 정보 미연결');
 $('panelLink').replaceChildren();$('noteInput').value='';$('previewMessage').hidden=true;$('previewMessage').textContent='';
 $('noteForm').hidden=true;$('noteNotice').hidden=true;
 if(obj.patrol){
  characterNodes.get(obj.id).btn.classList.add('is-selected');
  if(typeof obj.link==='string' && /^https:\/\/[^ ]+$/.test(obj.link)){
   const a=document.createElement('a');a.href=obj.link;a.rel='noopener noreferrer';a.target='_blank';a.textContent='기존 ChatGPT 프로젝트·GPT 열기';$('panelLink').append(a);
  }else $('panelLink').textContent='연결 URL 미설정 · 실제 ChatGPT 이동하지 않음';
 }else{
  objectButtons.get(obj.id).classList.add('is-active');
  if(obj.action==='highlight-path')$('bridgeGuide').removeAttribute('hidden');
  if(obj.action==='ripple'){$('pondRipple').hidden=false;if(!motionQuery.matches && !paused)$('pondRipple').classList.add('play')}
  if(obj.action==='local-note'){$('noteForm').hidden=false;$('noteNotice').hidden=false}
 }
}
$('noteForm').addEventListener('submit',e=>{
 e.preventDefault();const txt=$('noteInput').value.trim();if(!txt)return;
 $('previewMessage').textContent='우체통 메모 미리보기: '+txt;
 $('previewMessage').hidden=false;
});
$('close').addEventListener('click',closeInfo);
$('reset').addEventListener('click',closeInfo);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)closeInfo()});
$('toggleGuides').addEventListener('click',()=>{
 const on=stage.classList.toggle('debug');$('toggleGuides').setAttribute('aria-pressed',String(on));
});
function updateMotionLabel(){
 const isStopped=paused||motionQuery.matches;
 $('toggleMotion').textContent=isStopped?'움직임 재생':'움직임 정지';
 $('toggleMotion').setAttribute('aria-pressed',String(isStopped));
 $('toggleMotion').disabled=motionQuery.matches;
 if(!$('pondRipple').hidden)$('pondRipple').classList.toggle('play',!isStopped);
}
$('toggleMotion').addEventListener('click',()=>{paused=!paused;updateMotionLabel()});
if(motionQuery.addEventListener)motionQuery.addEventListener('change',updateMotionLabel);
updateMotionLabel();
function layout(){
 const width=viewport.clientWidth;
 const nativeFit=Math.min(1,width/scene.designSize.width);const scale=fitAll?nativeFit:Math.min(1,Math.max(scene.minSceneScale,nativeFit));
 if(Math.abs(scale-lastScale)<0.0001)return;
 lastScale=scale;
 const sw=scene.designSize.width*scale,sh=scene.designSize.height*scale;
 $('frameSizer').style.width=sw+'px';$('frameSizer').style.height=sh+'px';
 viewport.style.height=sh+'px';stage.style.transform='scale('+scale+')';
}
$('toggleFit').addEventListener('click',()=>{fitAll=!fitAll;lastScale=0;layout();$('toggleFit').textContent=fitAll?'확대 보기':'전체 보기';$('toggleFit').setAttribute('aria-pressed',String(fitAll));});new ResizeObserver(layout).observe(viewport);layout();
function track(actor,t){
 const p=actor.patrol,walk=p.walkMs,pause=p.pauseMs;
 const cycle=2*(walk+pause),phase=(t+p.offsetMs)%cycle;
 if(phase<walk)return {x:p.startX+(p.endX-p.startX)*phase/walk,y:p.y,moving:true,left:false};
 if(phase<walk+pause)return {x:p.endX,y:p.y,moving:false,left:false};
 if(phase<2*walk+pause)return {x:p.endX-(p.endX-p.startX)*(phase-walk-pause)/walk,y:p.y,moving:true,left:true};
 return {x:p.startX,y:p.y,moving:false,left:true};
}
function render(t){
 if(lastTime===0)lastTime=t;
 const delta=Math.min(Math.max(t-lastTime,0),100);lastTime=t;
 const canMove=!paused&&!motionQuery.matches&&panel.hidden&&!document.hidden;
 if(canMove)clock+=delta;
 for(const info of characterNodes.values()){
  const a=info.actor,step=track(a,clock);
  info.x=step.x;info.y=step.y;
  // Keep the clickable button stationary; only the sprite moves inside its corridor.
  const isWalk=info.walkReady,dir=step.left?'left':'right';
  const nextFrame=isWalk?(canMove&&step.moving?1+(Math.floor(clock/160)%6):1):(canMove&&step.moving?[1,2,3,6][Math.floor(clock/900)%4]:1);
  if(info.frame!==nextFrame||info.direction!==dir){
   info.img.src=isWalk?walkFrameSrc(a.id,dir,nextFrame):frameSrc(a.id,nextFrame);
   info.frame=nextFrame;info.direction=dir;
  }
  const center=(a.patrol.startX+a.patrol.endX)/2;
  const align=isWalk?[0,0]:(a.alignmentPx[info.frame-1]||[0,0]);
  info.btn.style.setProperty('--sprite-dx',(step.x-center)+'px');
  const bob=isWalk?0:((canMove&&step.moving)?Math.sin(clock/170)*1.1:0);
  info.img.style.transform='translate('+(step.x-center+align[0])+'px,'+(align[1]+bob)+'px)';
 }
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
</body></html>
